name: "🐛 Bug Report"
description: Something does not work as documented.
labels: [bug]
assignees: [Benjamin-eecs]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: >-
        What you ran (command + setting), what you expected, and what happened instead.
        Include the commit (`git rev-parse --short HEAD`) and logs.
    validations:
      required: true
